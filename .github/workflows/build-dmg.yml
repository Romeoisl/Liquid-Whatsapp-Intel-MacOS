name: Build and Release Liquid WhatsApp

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build Catalina Intel package
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check project
        run: npm run check

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build artifacts
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm run release
          else
            npm run build:catalina
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-WhatsApp-${{ github.ref_name }}-Catalina-Intel-DMG
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload ZIP artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-WhatsApp-${{ github.ref_name }}-Catalina-Intel-ZIP
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload manual-build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-WhatsApp-Catalina-Intel
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
